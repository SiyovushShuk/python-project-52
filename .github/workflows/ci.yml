name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with Ruff
        run: make lint

      - name: Run tests with coverage
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-dummy-secret-key' }}
          DEBUG: "False"
          DATABASE_URL: "sqlite://:memory:"
        run: |
          uv run coverage run manage.py test users.tests statuses.tests labels.tests tasks.tests -v 2
          uv run coverage report
          uv run coverage xml
          uv run python make_coverage_badge.py

      - name: Commit and push coverage badge update
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coverage-badge.json
          if git diff --cached --quiet; then
            echo "No coverage badge changes — skip commit"
          else
            git commit -m "chore(ci): auto-update coverage badge"
            git push
          fi
