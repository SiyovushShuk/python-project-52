[project]
name = "hexlet-code"
version = "0.1.0"
description = "Task Manager — система управления задачами, подобная Redmine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.0",
    "psycopg2-binary>=2.9",
    "dj-database-url>=2.0",
    "django-filter>=24.0",
    "whitenoise>=6.6",
    "gunicorn>=21.2",
    "python-dotenv>=1.0",
    "ruff>=0.16.9",
    "coverage>=7.6",
    "sentry-sdk[django]>=2.15",
]

[project.scripts]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["task_manager"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
exclude = [
    "*/migrations/*",
    "*/settings.py",
]

[tool.coverage.run]
source = [
    "task_manager",
    "users",
    "statuses",
    "labels",
    "tasks",
]
omit = [
    "*/migrations/*",
    "*/settings.py",
    "*/tests.py",
    "*/tests/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
