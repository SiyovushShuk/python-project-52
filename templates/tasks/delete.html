{% extends "base.html" %}

{% block title %}Удаление задачи{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold mb-6">Удаление задачи</h1>

<p class="mb-6 text-gray-700">Вы уверены, что хотите удалить задачу <strong>{{ task.name }}</strong>?</p>

<form method="post" class="max-w-md bg-white p-6 rounded-md shadow-sm border border-gray-200">
    {% csrf_token %}
    <button type="submit" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-red-600 hover:bg-red-700">
        Да, удалить
    </button>
    <a href="{% url 'tasks_list' %}" class="ml-4 inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
        Отмена
    </a>
</form>
{% endblock %}
