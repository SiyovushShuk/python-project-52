{% extends "base.html" %}

{% block title %}Удаление задачи{% endblock %}

{% block content %}
<h1 class="mb-4">Удалить задачу</h1>

<p class="mb-4">Вы уверены, что хотите удалить задачу <strong>{{ task.name }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger me-2">Да, удалить</button>
    <a href="{% url 'tasks_list' %}" class="btn btn-outline-secondary">Отмена</a>
</form>
{% endblock %}
