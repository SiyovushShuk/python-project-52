{% extends "base.html" %}

{% block title %}Статусы{% endblock %}

{% block content %}
<div class="mb-6">
    <h1 class="text-3xl font-bold mb-4">Статусы</h1>
    <a href="{% url 'status_create' %}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700">
        Создать статус
    </a>
</div>

<table class="min-w-full divide-y divide-gray-200 border border-gray-200 rounded-md overflow-hidden bg-white">
    <thead class="bg-gray-50">
        <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Имя</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Дата создания</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"></th>
        </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
        {% for status in statuses %}
        <tr class="hover:bg-gray-50">
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ status.id }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ status.name }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ status.created_at|date:"d.m.Y H:i" }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                <a href="{% url 'status_update' status.pk %}" class="text-blue-600 hover:text-blue-900 mr-4">Изменить</a>
                <a href="{% url 'status_delete' status.pk %}" class="text-red-600 hover:text-red-900">Удалить</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
